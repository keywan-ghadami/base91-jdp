[package]
name = "base91-jdp"
# Major and minor track the specification version this crate implements -- the
# wire format is what a consumer depends on. The patch level is the crate's own.
version = "0.4.0"
edition = "2021"
rust-version = "1.88"
description = "base91-jdp: basE91 on a JSON-safe alphabet, with typed segments. Prototype encoder and decoder for specification v0.4.0."
license = "MPL-2.0"
authors = ["Keywan Ghadami"]
repository = "https://github.com/keywan-ghadami/base91-jdp"
keywords = ["base91", "base64", "encoding", "binary-to-text", "json"]
categories = ["encoding", "text-processing"]

[lib]
name = "base91_jdp"
path = "src/lib.rs"

[features]
# Off by default, and nightly-only: `std::simd` is unstable. The crate is
# stable-only and portable without it, and the feature may only ever make the
# same decisions faster -- see src/simd.rs.
simd = []

[dev-dependencies]
rand = "0.9"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
