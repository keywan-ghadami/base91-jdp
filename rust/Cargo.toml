[package]
name = "base91-jdp"
# Major and minor track the specification version this crate implements -- the
# wire format is what a consumer depends on. The patch level is the crate's own.
version = "0.4.0"
edition = "2021"
rust-version = "1.88"
description = "base91-jdp: basE91 on a JSON-safe alphabet, with typed segments. Prototype encoder and decoder for specification v0.4.0."
license = "MPL-2.0"
authors = ["Keywan Ghadami"]
repository = "https://github.com/keywan-ghadami/base91-jdp"
keywords = ["base91", "base64", "encoding", "binary-to-text", "json"]
categories = ["encoding", "text-processing"]

[lib]
name = "base91_jdp"
path = "src/lib.rs"

[features]
default = ["zstd"]

# Off by default, and nightly-only: `std::simd` is unstable. The crate is
# stable-only and portable without it, and the feature may only ever make the
# same decisions faster -- see src/simd.rs.
simd = []

# Class 20, the compressed segment. On by default, because a decoder that
# cannot read it is a different format in practice (specification section
# 15.5) -- but separable, so the container can be built and measured without a
# compression library in the way.
zstd = ["dep:zstd"]

[dependencies]
# Class 20 only. The container needs nothing.
# `experimental` is what exposes the magicless frame format: the four magic
# bytes repeat what the segment signal already said (specification section 10.1).
zstd = { version = "0.13.3", optional = true, features = ["experimental"] }

# The codec this one is compared against, built from its own source rather
# than quoted from its documentation, so that both sides of every number in
# `examples/headtohead.rs` run in one process under one timing harness. Off by
# default and used by no part of the library; it needs a Base85N checkout
# beside this repository.
base85n = { path = "../../keywan-ghadami/base85n/rust", optional = true }

[dev-dependencies]
rand = "0.9"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

# Examples that measure the compressed class only build with it.
[[example]]
name = "ablate"
required-features = ["zstd"]

[[example]]
name = "compress"
required-features = ["zstd"]

[[example]]
name = "compresscorpus"
required-features = ["zstd"]

[[example]]
name = "crossover"
required-features = ["zstd"]

[[example]]
name = "decide"
required-features = ["zstd"]

[[example]]
name = "frames"
required-features = ["zstd"]

[[example]]
name = "longdata"
required-features = ["zstd"]

[[example]]
name = "norun"
required-features = ["zstd"]
[[example]]
name = "merge"
required-features = ["zstd"]
[[example]]
name = "strip"
required-features = ["zstd"]
[[example]]
name = "onelblock"
required-features = ["zstd"]
[[example]]
name = "shortnow"
required-features = ["zstd"]
[[example]]
name = "firstwin"
required-features = ["zstd"]
[[example]]
name = "rans91"
[[example]]
name = "headtohead"
required-features = ["zstd", "base85n"]
[[example]]
name = "decoderate"
required-features = ["base85n"]
