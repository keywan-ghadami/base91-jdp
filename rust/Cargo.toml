[package]
name = "base91z"
# Major and minor track the specification version this crate implements -- the
# wire format is what a consumer depends on. The patch level is the crate's own.
version = "0.4.0"
edition = "2021"
rust-version = "1.88"
description = "Base91z: a binary-to-text encoding for bytes inside text protocols, on an alphabet JSON never has to escape, with typed segments and zstd inside. Reference implementation of specification v0.4.0, with a C ABI."
license = "MPL-2.0"
authors = ["Keywan Ghadami"]
repository = "https://github.com/keywan-ghadami/base91z"
keywords = ["base91", "base64", "encoding", "binary-to-text", "json"]
categories = ["encoding", "text-processing"]
readme = "README.md"
homepage = "https://keywan-ghadami.github.io/base91z/"
documentation = "https://docs.rs/base91z"
# What goes in the published tarball, listed rather than excluded -- cargo
# ignores `exclude` when both are given, and warns about it.
#
# `include/` is here because the C header is part of what this crate ships: a
# caller linking the staticlib needs it, and `tests/ffi.rs` checks it against
# `src/ffi.rs`. `tests/support/` is here because the adversarial suite includes
# it. What is deliberately absent is `fuzz/`, which is its own workspace with a
# path dependency back on this one and so cannot build from a tarball at all.
include = ["src/**", "include/**", "examples/**", "tests/**", "README.md", "Cargo.toml"]

# docs.rs builds on nightly, where `simd` would compile -- but the feature is
# an acceleration that may never change a decision, so documenting it would
# advertise a difference that does not exist. Default features only.
[package.metadata.docs.rs]
all-features = false

[lib]
name = "base91z"
path = "src/lib.rs"
# rlib for Rust callers; cdylib and staticlib for everyone else, through the C
# ABI in src/ffi.rs and the header in include/base91z.h. The Python module in
# ../python does not go through this -- it is PyO3 over the rlib.
crate-type = ["rlib", "cdylib", "staticlib"]

[features]
default = ["zstd"]

# Off by default, and nightly-only: `std::simd` is unstable. The crate is
# stable-only and portable without it, and the feature may only ever make the
# same decisions faster -- see src/simd.rs.
simd = []

# Class 20, the compressed segment. On by default, because a decoder that
# cannot read it is a different format in practice (specification section
# 15.5) -- but separable, so the container can be built and measured without a
# compression library in the way.
zstd = ["dep:zstd"]

[dependencies]
# Class 20 only. The container needs nothing.
# `experimental` is what exposes the magicless frame format: the four magic
# bytes repeat what the segment signal already said (specification section 10.1).
zstd = { version = "0.13.3", optional = true, features = ["experimental"] }

[dev-dependencies]
rand = "0.9"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

# Examples that measure the compressed class only build with it.
[[example]]
name = "ablate"
required-features = ["zstd"]

[[example]]
name = "compress"
required-features = ["zstd"]

[[example]]
name = "compresscorpus"
required-features = ["zstd"]

[[example]]
name = "crossover"
required-features = ["zstd"]

[[example]]
name = "decide"
required-features = ["zstd"]

[[example]]
name = "frames"
required-features = ["zstd"]

[[example]]
name = "levels"
required-features = ["zstd"]

[[example]]
name = "longdata"
required-features = ["zstd"]

[[example]]
name = "norun"
required-features = ["zstd"]
[[example]]
name = "merge"
required-features = ["zstd"]
[[example]]
name = "strip"
required-features = ["zstd"]
[[example]]
name = "onelblock"
required-features = ["zstd"]
[[example]]
