name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    name: The implementation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Test, with the compressed class
        run: cargo test --release --manifest-path rust/Cargo.toml
      - name: Test, without it
        run: cargo test --release --manifest-path rust/Cargo.toml --no-default-features
      - name: Warnings are errors
        run: cargo clippy --manifest-path rust/Cargo.toml --all-targets -- -D warnings
        continue-on-error: true

  simd:
    name: The vector paths
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      # The feature may only ever make the same decisions faster, so the whole
      # suite runs under it and must agree character for character.
      - run: cargo test --release --manifest-path rust/Cargo.toml --features simd

  measure:
    name: Sizes on the corpus
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # The corpus lives in binary2textbench now, and fetch.sh fills
      # bench/corpus/ from it, so the examples below read it unchanged.
      - name: Fetch the core and short corpora
        run: bench/fetch.sh core,short
      - name: Size and round trip, per file
        run: |
          cargo run --release --manifest-path rust/Cargo.toml --example corpus -- bench/corpus
          cargo run --release --manifest-path rust/Cargo.toml --example short -- bench/corpus/short

  docs:
    name: Links in the documents
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r site/requirements.txt
      # Two checks in one: anchors and page links inside the built site, and
      # every relative Markdown link against the working tree. The second is
      # what catches a link to a repository file that has been deleted -- the
      # build rewrites those to github.com, so nothing else would.
      - name: Build the site and resolve every link
        run: |
          python site/build.py --output _site
          python site/check_links.py _site
