# Puts Base85N where rust/Cargo.toml expects it.
#
# The manifest carries an optional path dependency on Base85N at
# ../../keywan-ghadami/base85n/rust, for examples/headtohead.rs and the other
# comparisons -- and Cargo reads a path dependency whether or not its feature is
# enabled. So without this, nothing in rust/ builds here at all: `cargo test`,
# `cargo clippy` and every example fail before they start, which is what had CI
# red on every Rust job.
#
# The path is outside GITHUB_WORKSPACE, where actions/checkout will not write,
# so the checkout lands inside the workspace and is linked out to where Cargo
# looks. That keeps the layout bench/README.md documents for a developer -- a
# Base85N checkout beside this repository -- working unchanged.
name: Check out Base85N beside this repository
description: Satisfies the optional path dependency in rust/Cargo.toml.

runs:
  using: composite
  steps:
    - uses: actions/checkout@v4
      with:
        repository: keywan-ghadami/base85n
        path: .base85n
    - name: Link it to where Cargo looks
      shell: bash
      run: |
        set -euo pipefail
        beside="$(dirname "$GITHUB_WORKSPACE")/keywan-ghadami"
        mkdir -p "$beside"
        ln -sfn "$GITHUB_WORKSPACE/.base85n" "$beside/base85n"
        test -f "$beside/base85n/rust/Cargo.toml"
